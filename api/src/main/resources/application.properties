# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE (From Environment)
# ===============================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CRITICAL: Railway timeout settings
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

spring.jpa.open-in-view=false

server.tomcat.threads.max=20

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SHOPIFY CONFIG
# ===============================
shopify.api.key=${SHOPIFY_CLIENT_ID}
shopify.api.secret=${SHOPIFY_CLIENT_SECRET}
shopify.redirect.uri=${SHOPIFY_REDIRECT_URL}
shopify.scopes=${SHOPIFY_SCOPES}

meta.access.token=${META_ACCESS_TOKEN}
meta.ad.account.id=${META_AD_ACCOUNT_ID}

# ===============================
# WEBHOOK CONFIG
# ===============================
shopify.webhook.url=${SHOPIFY_WEBHOOK_URL}

# ===============================
# SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs

# Google Sign-In (set GOOGLE_CLIENT_ID in env for production)
google.client-id=${GOOGLE_CLIENT_ID:}
